services:
  web:
    build:
      context: .
    ports:
      - '8000:8000'
    command: 'python3 manage.py runserver 0.0.0.0:8000'
    volumes:
      - '.:/code'
    depends_on:
      - db
  db:
    image: postgres:17-bookworm
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"
volumes:
  postgres_data: