{% extends "blog/base.html" %}
<h2>Blog</h2>

{% block content %}
{% for post in posts %}
<h3>
      <a href="{{ post.get_absolute_url }}">
        {{ post.title }}
      </a>
</h3>
<p class="date">
      Published {{ post.publish }} by {{ post.author }}
    </p>
{{ post.body|truncatewords:30|linebreaks }}
{% endfor %}
{% endblock %}
